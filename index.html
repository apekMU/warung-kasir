<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warung Kasir</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f3f4f6;color:#222}
header{background:#198754;color:white;padding:18px;text-align:center}
.container{max-width:1100px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.box{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px #ddd;margin-bottom:20px}
input{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccc;border-radius:7px}
button{border:0;padding:10px 14px;border-radius:7px;cursor:pointer;background:#198754;color:white}
button.danger{background:#dc3545}
button.blue{background:#0d6efd}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}
.total{font-size:24px;font-weight:bold;margin:20px 0}
.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ddd}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>

<body>

<header>
<h1>🛒 WARUNG KASIR</h1>
<p>Sistem Kasir Warung</p>
</header>

<div class="container">

<div class="grid">

<!-- KELOLA BARANG -->
<div class="box">
<h2>📦 Kelola Barang</h2>

<input id="nama" placeholder="Nama barang">
<input id="harga" type="number" placeholder="Harga jual">
<input id="stok" type="number" placeholder="Stok">

<button onclick="tambahBarang()">➕ Tambah Barang</button>

<div id="daftarBarang"></div>
</div>

<!-- TRANSAKSI -->
<div class="box">

<h2>🛒 Transaksi</h2>

<div id="keranjang">
<p>Belum ada barang.</p>
</div>

<div class="total">
Total: <span id="total">Rp 0</span>
</div>

<input id="uang" type="number" placeholder="Uang pembayaran">

<button class="blue" onclick="bayar()">💰 BAYAR</button>

</div>

</div>

<div class="box">

<h2>📋 Daftar Barang</h2>

<table>
<thead>
<tr>
<th>Nama</th>
<th>Harga</th>
<th>Stok</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="tabelBarang"></tbody>

</table>

</div>

</div>

<script>

let barang = JSON.parse(localStorage.getItem("barang")) || [
{
nama:"Indomie Goreng",
harga:3500,
stok:20
},
{
nama:"Aqua 600ml",
harga:3000,
stok:20
},
{
nama:"Teh Botol",
harga:4000,
stok:15
}
];

let keranjang = [];

function simpan(){
localStorage.setItem("barang",JSON.stringify(barang));
}

function rupiah(n){
return "Rp " + n.toLocaleString("id-ID");
}

function tambahBarang(){

let nama=document.getElementById("nama").value.trim();
let harga=parseInt(document.getElementById("harga").value);
let stok=parseInt(document.getElementById("stok").value);

if(!nama || !harga || stok<0){
alert("Lengkapi data barang!");
return;
}

barang.push({
nama:nama,
harga:harga,
stok:stok
});

simpan();

document.getElementById("nama").value="";
document.getElementById("harga").value="";
document.getElementById("stok").value="";

tampilkan();

}

function hapusBarang(index){

if(confirm("Hapus barang ini?")){

barang.splice(index,1);

simpan();

tampilkan();

}

}

function tambahKeranjang(index){

let b=barang[index];

if(b.stok<=0){
alert("Stok habis!");
return;
}

let item=keranjang.find(x=>x.index===index);

if(item){

if(item.qty>=b.stok){
alert("Stok tidak mencukupi!");
return;
}

item.qty++;

}else{

keranjang.push({
index:index,
nama:b.nama,
harga:b.harga,
qty:1
});

}

tampilkan();

}

function hapusKeranjang(index){

keranjang.splice(index,1);

tampilkan();

}

function totalTransaksi(){

return keranjang.reduce(
(total,item)=>total+(item.harga*item.qty),0
);

}

function tampilkan(){

let daftar=document.getElementById("daftarBarang");

daftar.innerHTML="";

barang.forEach((b,i)=>{

daftar.innerHTML+=`

<div class="item">

<span>
<b>${b.nama}</b><br>
${rupiah(b.harga)} | Stok ${b.stok}
</span>

<button onclick="tambahKeranjang(${i})">
Tambah
</button>

</div>

`;

});

let tabel=document.getElementById("tabelBarang");

tabel.innerHTML="";

barang.forEach((b,i)=>{

tabel.innerHTML+=`

<tr>

<td>${b.nama}</td>

<td>${rupiah(b.harga)}</td>

<td>${b.stok}</td>

<td>

<button class="danger"
onclick="hapusBarang(${i})">
Hapus
</button>

</td>

</tr>

`;

});

let keranjangArea=document.getElementById("keranjang");

if(keranjang.length===0){

keranjangArea.innerHTML="<p>Belum ada barang.</p>";

}else{

keranjangArea.innerHTML="";

keranjang.forEach((item,i)=>{

keranjangArea.innerHTML+=`

<div class="item">

<span>
${item.nama} x ${item.qty}
</span>

<span>
${rupiah(item.harga*item.qty)}

<button class="danger"
onclick="hapusKeranjang(${i})">
X
</button>

</span>

</div>

`;

});

}

document.getElementById("total").innerText=
rupiah(totalTransaksi());

}

function bayar(){

if(keranjang.length===0){

alert("Keranjang kosong!");

return;

}

let uang=parseInt(document.getElementById("uang").value)||0;

let total=totalTransaksi();

if(uang<total){

alert(
"Uang kurang " +
rupiah(total-uang)
);

return;

}

let kembalian=uang-total;

keranjang.forEach(item=>{

barang[item.index].stok-=item.qty;

});

simpan();

alert(
"TRANSAKSI BERHASIL\n\n"+
"Total: "+rupiah(total)+
"\nBayar: "+rupiah(uang)+
"\nKembalian: "+rupiah(kembalian)
);

keranjang=[];

document.getElementById("uang").value="";

tampilkan();

}

tampilkan();

</script>

</body>
</html>
