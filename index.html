<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warung Kasir</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #198754;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,.08);
        }

        .card h3 {
            margin-bottom: 8px;
        }

        .harga {
            color: #198754;
            font-weight: bold;
        }

        button {
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            background: #198754;
            color: white;
            margin-top: 10px;
        }

        button:hover {
            opacity: .9;
        }

        .keranjang {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,.08);
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }

        .bayar {
            width: 100%;
            background: #0d6efd;
            font-size: 18px;
        }

        @media(max-width:600px) {
            .container {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🛒 WARUNG KASIR</h1>
    <p>Sistem Kasir Warung Sederhana</p>
</header>

<div class="container">

    <h2 style="margin-bottom:15px;">Daftar Barang</h2>

    <div class="menu">

        <div class="card">
            <h3>Indomie Goreng</h3>
            <p class="harga">Rp 3.500</p>
            <button onclick="tambah('Indomie Goreng',3500)">
                + Tambah
            </button>
        </div>

        <div class="card">
            <h3>Aqua 600ml</h3>
            <p class="harga">Rp 3.000</p>
            <button onclick="tambah('Aqua 600ml',3000)">
                + Tambah
            </button>
        </div>

        <div class="card">
            <h3>Teh Botol</h3>
            <p class="harga">Rp 4.000</p>
            <button onclick="tambah('Teh Botol',4000)">
                + Tambah
            </button>
        </div>

        <div class="card">
            <h3>Rokok</h3>
            <p class="harga">Rp 25.000</p>
            <button onclick="tambah('Rokok',25000)">
                + Tambah
            </button>
        </div>

    </div>

    <div class="keranjang">

        <h2>🛍️ Keranjang</h2>

        <div id="keranjang">
            <p style="margin-top:15px;">Belum ada barang.</p>
        </div>

        <div class="total">
            Total:
            <span id="total">Rp 0</span>
        </div>

        <button class="bayar" onclick="bayar()">
            💰 BAYAR
        </button>

    </div>

</div>

<script>

let keranjang = [];
let total = 0;

function tambah(nama, harga) {

    keranjang.push({
        nama: nama,
        harga: harga
    });

    total += harga;

    tampilkan();
}

function tampilkan() {

    let area = document.getElementById("keranjang");

    if (keranjang.length === 0) {
        area.innerHTML = "<p>Belum ada barang.</p>";
        return;
    }

    let html = "";

    keranjang.forEach((item, index) => {

        html += `
            <div class="item">
                <span>${item.nama}</span>

                <span>
                    Rp ${item.harga.toLocaleString("id-ID")}
                    <button onclick="hapus(${index})">
                        X
                    </button>
                </span>
            </div>
        `;
    });

    area.innerHTML = html;

    document.getElementById("total").innerText =
        "Rp " + total.toLocaleString("id-ID");
}

function hapus(index) {

    total -= keranjang[index].harga;

    keranjang.splice(index, 1);

    tampilkan();
}

function bayar() {

    if (keranjang.length === 0) {
        alert("Keranjang masih kosong!");
        return;
    }

    alert(
        "Transaksi berhasil!\n\n" +
        "Total: Rp " +
        total.toLocaleString("id-ID")
    );

    keranjang = [];
    total = 0;

    tampilkan();
}

</script>

</body>
</html>
